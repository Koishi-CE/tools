version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # devDependencies 一次性打包成一个 PR：本仓 devDeps 全是工具链（biome / tsdown /
      # typescript / changesets），逐个开 PR 只会淹没有意义的评审。
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
